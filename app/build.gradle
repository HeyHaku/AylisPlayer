apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.aylis'
    compileSdk 34

    defaultConfig {

        applicationId "com.aylis"
        minSdk 31
        targetSdk 34
        multiDexEnabled true

        versionCode 1
        versionName "1.0.0"
    }

    def keyPropertiesFile = rootProject.file("key.properties")
    def keyProperties = new Properties()
    if (keyPropertiesFile.exists()) {
        keyProperties.load(new FileInputStream(keyPropertiesFile))
    }

    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }





    sourceSets {
        main {
            def resDirs = ['src/main/res']
            def layoutDir = file('src/main/res/layout')
            if (layoutDir.exists()) {
                layoutDir.listFiles().each {
                    if (it.isDirectory()) {
                        resDirs += it.path
                    }
                }
            }
            res.srcDirs = resDirs
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }

    flatDir {
        dirs 'libs'
    }

}

configurations {
    all {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
}

dependencies {
    api fileTree(include: ['*.jar'], exclude: ['annotations-12.0.jar'], dir: 'libs')

    api group: 'com.google.guava', name: 'guava', version: '24.1-jre'

    implementation(name:'recyclerviewfastscroller-release', ext:'aar')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.media3:media3-exoplayer:1.1.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.1.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.1.0'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.1.0'
    implementation 'androidx.media3:media3-session:1.1.0'
    implementation 'androidx.media3:media3-ui:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'junit:junit:4.12'
    implementation 'androidx.core:core-ktx:1.12.0'


    implementation 'com.squareup.moshi:moshi:1.15.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
    
    // Encrypted Preferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Online Music (InnerTube) dependencies
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Настоящий разшифратор (NewPipe Extractor)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    
    // UI Libraries
    implementation 'nl.joery.animatedbottombar:library:1.1.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    
    // Audio Tagger for metadata
    implementation 'net.jthink:jaudiotagger:3.0.1'
}

